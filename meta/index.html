<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta · Luis Corona</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
</head>
<body>
    <h1>Meta</h1>
    <p>
        Codebase statistics for this portfolio: lines of code, commits, and related metrics generated from the repo.
        Scroll through the commit story to see how the codebase evolved over time.
    </p>

    <div class="commit-progress-control">
        <label>
            Show commits until:
            <input type="range" id="commit-progress" min="0" max="100" value="100" step="any">
            <time id="commit-cutoff-time"></time>
        </label>
    </div>

    <div id="stats"></div>

    <h2>Commits by time of day</h2>

    <div id="scrolly-1">
        <div id="scatter-story"></div>
        <div id="scatter-plot">
            <div id="chart"></div>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>

            <dl id="commit-tooltip" class="info tooltip" hidden>
                <dt>Commit</dt>
                <dd>
                    <a href="" id="commit-link" target="_blank" rel="noopener noreferrer"></a>
                </dd>

                <dt>Date</dt>
                <dd id="commit-date"></dd>

                <dt>Time</dt>
                <dd id="commit-time"></dd>

                <dt>Author</dt>
                <dd id="commit-author"></dd>

                <dt>Lines edited</dt>
                <dd id="commit-lines"></dd>
            </dl>
        </div>
    </div>

    <h2>File sizes over time</h2>
    <dl id="files"></dl>

    <script type="module" src="main.js"></script>
</body>
</html>
